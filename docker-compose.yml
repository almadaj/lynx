services:
  postgres:
    image: postgres:18
    container_name: educ_app_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - educ_app_postgres_data:/var/lib/postgresql

volumes:
  educ_app_postgres_data:
    name: educ_app_postgres_data