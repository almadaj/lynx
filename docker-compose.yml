services:
  postgres:
    image: postgres:18
    container_name: educ_app_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - educ_app_postgres_data:/var/lib/postgresql

  rabbitmq:
    image: rabbitmq:4-management
    container_name: lynx_rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: lynx
      RABBITMQ_DEFAULT_PASS: lynx_study_123
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  educ_app_postgres_data:
    name: educ_app_postgres_data