spring.application.name=lynx
server.port=${APP_PORT:8080}

#spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:lynx}
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
spring.security.method.security.enabled=false
spring.jackson.mapper.sort-properties-alphabetically=false

storage.endpoint=${STORAGE_ENDPOINT}
storage.region=${STORAGE_REGION}
storage.bucket=${STORAGE_BUCKET}
storage.access-key=${STORAGE_ACCESS_KEY}
storage.secret-key=${STORAGE_SECRET_KEY}
springdoc.api-docs.enabled=${SWAGGER_ENABLED}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED}

spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
security.refresh-token.expiration=604800

spring.flyway.enabled=true
spring.flyway.locations=classpath:/db/migration